user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 8099 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # HA-native read-only credential is added only after the request reaches
        # this server boundary. No browser response contains the credential.
        location ^~ /ha-read/api/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://supervisor/core/api/;
            proxy_set_header Authorization "Bearer %%HA_READ_TOKEN%%";
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_redirect off;
        }

        location ^~ /ha-read/local/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://supervisor/core/local/;
            proxy_set_header Authorization "Bearer %%HA_READ_TOKEN%%";
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # The Node bridge accepts only four validated, read-only HA WS commands.
        location = /ha-read/ws-command {
            if ($request_method != POST) { return 405; }
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:8098/ws-command;
            proxy_set_header Content-Type application/json;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # Fixed irrigation publication boundary: exactly three immutable targets.
        location = /publish/irrigation/today-max-temperature {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%IRRIGATION_PUBLISHER_SECRET%%") { return 401; }
            client_max_body_size 16k;
            proxy_pass http://supervisor/core/api/states/sensor.openclaw_irrigation_today_max_temperature;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/irrigation/lawn-right-hours-since-run {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%IRRIGATION_PUBLISHER_SECRET%%") { return 401; }
            client_max_body_size 16k;
            proxy_pass http://supervisor/core/api/states/sensor.openclaw_lawn_right_hours_since_run;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/irrigation/lawn-left-hours-since-run {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%IRRIGATION_PUBLISHER_SECRET%%") { return 401; }
            client_max_body_size 16k;
            proxy_pass http://supervisor/core/api/states/sensor.openclaw_lawn_left_hours_since_run;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }

        # Alfred operations publication boundary: exactly thirteen targets.
        location = /publish/alfred/ops-dashboard {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_ops_dashboard;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/memory-status {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_memory_status;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/mac-mini-cpu-usage {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.mac_mini_cpu_usage;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/mac-mini-ram-usage {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.mac_mini_ram_usage;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/mac-mini-disk-usage {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.mac_mini_disk_usage;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/gateway {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/binary_sensor.alfred_gateway;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/ollama {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/binary_sensor.alfred_ollama;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/location-bridge {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/binary_sensor.alfred_location_bridge;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/gateway-health {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_gateway_health;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/gateway-status {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_gateway_status;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/task-stats {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_task_stats;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/token-usage {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_token_usage;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }
        location = /publish/alfred/cron-list {
            if ($request_method != POST) { return 405; }
            if ($http_x_alfred_publisher_key != "%%ALFRED_PUBLISHER_SECRET%%") { return 401; }
            proxy_pass http://supervisor/core/api/states/sensor.alfred_cron_list;
            proxy_set_header Authorization "Bearer %%HA_PUBLISH_TOKEN%%";
            proxy_set_header Content-Type application/json;
        }

        location /remux-api/ {
            proxy_pass http://192.168.1.150:8765/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }
        location ^~ /mobile/assets/ { alias /usr/share/nginx/html/assets/; expires 1y; add_header Cache-Control "public, immutable"; }
        location /mobile { try_files $uri $uri/ /mobile.html; add_header X-Content-Type-Options "nosniff" always; }
        location = /mobile.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location = / {
            if ($http_user_agent ~* "iPhone|Android.*Mobile") { return 302 mobile/; }
            try_files $uri /index.html;
        }
        location / { try_files $uri $uri/ /index.html; add_header X-Content-Type-Options "nosniff" always; }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { expires 1y; add_header Cache-Control "public, immutable"; }
        location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location = /config.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    }
}
